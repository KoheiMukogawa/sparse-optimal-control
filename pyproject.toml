[project]
name = "sparse-optimal-control"
version = "0.1.0"
description = "農業ロボットの経路追従におけるスパース最適制御（Maximum Hands-off Control）の研究"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.8.2",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "opencv-python>=5.0.0.93",
    "rosbags>=0.11.3",
    "scipy>=1.17.1",
]

[tool.uv]
# 配布パッケージではなく rover/ のスクリプト群を `uv run python rover/xxx.py` で
# 実行する運用。プロジェクト自体はビルドしないため main.py/src レイアウトは不要。
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# rover/*_test.py・rover/spin_test.py はテストではなく `uv run python rover/xxx.py`
# で実行するスクリプト（README参照）。rover/spin_test.py は rclpy（ROS2）に依存し、
# pip 依存にないため pytest が収集すると ImportError になる。
# 実際の pytest テストは tests/ 配下にのみ置く。
testpaths = ["tests"]
