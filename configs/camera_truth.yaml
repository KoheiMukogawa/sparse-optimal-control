# カメラ真値計測の設定（設計: specs/2026-07-16-camera-truth-pipeline-design.md）
# K / dist は rover/calibrate_camera.py の出力を貼り付ける。
# floor_tags はタグ中心の実測コース座標 [m]（原点=走行原点, x=第1直進方向）。
# タグの印刷サイズ精度は不要（中心と光線交点のみ使用。サイズは検出可否にだけ効く）。
camera:
  name: c270_360p           # 使用カメラ・モードを記録（レンズ切替時は要再キャリブ）
  image_size: [640, 360]    # キャリブ動画の解像度・向き。本番動画と不一致なら即エラー
  # 2026-07-16 キャリブ（WIN_20260716_08_42_18_Pro.mp4・1280x720・再投影誤差0.261px）を
  # 2026-07-17 に 640x360 へ正確に1/2スケール（同一レンズ・同一16:9クロップ。distは
  # 正規化座標なので不変）。理由: WSL標準カーネルのvhci_hcdが等時転送を約64KB/フレームで
  # 頭打ちにし、720pはMJPG/YUYVとも尻切れ。360pのMJPGは20/20完全（実測）
  K:
    - [687.245, 0.00, 362.305]
    - [0.00, 688.655, 191.695]
    - [0.00, 0.00, 1.00]
  dist: [0.16015, -0.30996, -0.00027, 0.01458, 0.00000]
floor_tag_size_m: 0.135  # 印刷黒枠の実測値[m]（2026-07-17 定規実測。generate_pdfのA4縮小で公称15cm→13.5cm）
floor_tags:      # id: [x_m, y_m]。4枚とも実測して記入
  # 2026-07-16 確定（6+2距離の2点測位で全タグ確定。コース実寸: 脚99/100cm・
  # ゴール実位置(0.98,1.00)。id2は撮影後に移動→ゴール外側(goal+15,15)へ再配置）
  0: [0.000, -0.200]
  1: [0.434, 0.392]
  2: [1.130, 1.150]
  3: [1.194, -0.297]
robot_tag:
  id: 10
  z_m: 0.12            # 床→タグ面の高さ（2026-07-16 実測。LIDAR上の台・箱とも12cm）
  yaw_offset_rad: 0.0  # タグ正準+x と機体前方のズレ
live:            # Phase 2: ライブ検出（WSL2は usbipd attach が必要）
  device: 0      # /dev/videoN の N
  width: 640     # vhci_hcdの64KB/フレーム制限内に収まる解像度（image_sizeと一致させる）
  height: 360
udp:             # Phase 3: laptop→RPi の復帰指令ブリッジ
  port: 8890     # 宛先ホストは run_batch が RealBackend の接続先を使う
