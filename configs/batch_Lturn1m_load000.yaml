# 外乱バッチ: 積載 000g（1m L字・4条件＝Kanayama + MPC3条件・真値評価が主指標）
# 大学環境ではカメラを置けないため --auto ではなく --manual（方眼直読）で回す。
# 重りはペットボトル等を駆動軸直上・車体中心にテープ固定（毎回同位置・同姿勢）。
# 実行: uv run python rover/run_batch.py configs/batch_Lturn1m_load000.yaml \
#         --backend real --manual --outdir results/<日付>_load000
name: Lturn1m_load000
path_file: configs/path_L_turn_1m.yaml
backend: real
repeats: 3
timeout_s: 60
common: {horizon: 15, rate: 10.0}
sim: {delay_steps: 2, pos_noise: 0.0, yaw_noise: 0.0}
conditions:
  - {name: kanayama, controller: kanayama}   # 表6.5 のベースライン（R3）
  - {name: l2,     controller: l2}
  - {name: l1,     controller: l1, lam: 0.3}
  - {name: l1_ms2, controller: l1, lam: 0.3, move_suppress: 2.0}
